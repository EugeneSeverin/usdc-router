[project]
name = "usdc-router"
version = "0.1.0"
description = "USDC Router — dashboard + one-click USDC transfer between Solana and Aptos via Circle CCTP V2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.20",
    "asyncpg>=0.31",
    "aiosqlite>=0.22",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "plotly>=7.1",
    "qrcode>=8.2",
    "pillow>=12.3",
    "pynacl>=1.6",
    "solders>=0.26",
    "solana>=0.36",
    "anchorpy>=0.21",
    "aptos-sdk>=0.12",
    "aiogram>=3.31",
    "arq>=0.28",
    "redis>=5.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "respx>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:anchorpy"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
